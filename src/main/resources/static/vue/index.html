    <title>Kecore AI Vue</title>

    <script>
      (function () {
        try {
          var mode = localStorage.getItem("spring-ai-mode") || "chat";
          if (mode === "game" || mode === "paper") mode = "finance";
          if (!/^(chat|finance|agent)$/.test(mode)) mode = "chat";
          document.documentElement.setAttribute("data-initial-mode", mode);
        } catch (error) {
          document.documentElement.setAttribute("data-initial-mode", "chat");
        }
      })();
    </script>

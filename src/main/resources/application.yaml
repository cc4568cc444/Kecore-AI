spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/spring_agent
    username: postgres
    password: 123
    driver-class-name: org.postgresql.Driver
  application:
    name: springai
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  ai:
    model:
      chat: openai
      embedding: none
      audio:
        speech: none
        transcription: none
      image: none
      moderation: none
    openai:
      chat:
        base-url: https://nbaiapi.com
        completions-path: /v1/chat/completions
        api-key: ${CAICHEN_KEY}
        options:
          model: gpt-5.5
          temperature: 0.4
          #        base-url: https://token-plan-cn.xiaomimimo.com|https://api.xiaomimimo.com
          #        api-key: ${MIMO_KEY}
          #        completions-path: /v1/chat/completions
    #    dashscope:
    #      api-key: ${ALI_KEY}
    #      embedding:
    #        options:
    #          model: text-embedding-v4
    #          dimensions: 1024
    vectorstore:
      pgvector:
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 768
        max-document-batch-size: 10
        initialize-schema: true
    mcp:
      client:
        enabled: true
        type: sync
        initialized: false
        toolcallback:
          enabled: true
        streamable-http:
          connections:
            utools:
              url: http://127.0.0.1:3501
              endpoint: /mcp
            my-coffee:
              url: https://gwmcp.lkcoffee.com
              endpoint: /order/user/mcp
        stdio:
          connections:
            email-mailer:
              command: 'E:\python\python.exe'
              args:
                - src/main/resources/mcp/email/email_mcp_server.py
              env:
                EMAIL_MCP_CONFIG: ${EMAIL_MCP_CONFIG:}
                EMAIL_SMTP_HOST: ${EMAIL_SMTP_HOST:}
                EMAIL_SMTP_PORT: ${EMAIL_SMTP_PORT:}
                EMAIL_SMTP_USERNAME: ${EMAIL_SMTP_USERNAME:}
                EMAIL_SMTP_PASSWORD: ${EMAIL_SMTP_PASSWORD:}
                EMAIL_SMTP_FROM_EMAIL: ${EMAIL_SMTP_FROM_EMAIL:}
                EMAIL_SMTP_FROM_NAME: ${EMAIL_SMTP_FROM_NAME:Spring AI Mailer}
                EMAIL_SMTP_USE_TLS: ${EMAIL_SMTP_USE_TLS:False}
                EMAIL_SMTP_USE_SSL: ${EMAIL_SMTP_USE_SSL:True}
                EMAIL_SMTP_TIMEOUT: ${EMAIL_SMTP_TIMEOUT:}
            calculator:
              command: node
              args:
                - D:\MCP\calculator-mcp\index.js

app:
  default-models:
    model1:
      base-url: https://api.deepseek.com
      completions-path: /v1/chat/completions
      api-key: ${DEEPSEEK_KEY:}
      options:
        model: deepseek-v4-flash
    model2:
      base-url: https://nbaiapi.com
      completions-path: /v1/chat/completions
      api-key: ${CAICHEN_KEY:}
      options:
        model: gpt-5.5
        temperature: 0.4
    model3:
      base-url: https://nusapi.xyz/v1
      completions-path: /v1/chat/completions
      api-key: ${MINIMAX_KEY:}
      options:
        model: MINIMAX

  embedding:
    ollama:
      base-url: http://172.16.1.114:11434
      model: qwen3-embedding:0.6b
      #      model: nomic-embed-text-v2-moe:latest
      dimensions: 1024
  financial-rag:
    table: multidoc_full_chunks
    fallback-table: multidoc_s2_full_chunks
    legacy-fallback-table: multidoc_s2_medium_chunks
    top-k: 10
    hybrid-top-k: 60
    evidence-ledger:
      enabled: true
      max-documents: 8
      max-content-chars: 1800
      max-total-content-chars: 12000
      max-documents-per-task: 2
      retry-on-empty: true
    answer-coverage-repair:
      enabled: true
    citation-verifier:
      enabled: true
      strict: true
    rerank:
      enabled: true
      url: http://127.0.0.1:8010
      model: Qwen3-Reranker-0.6B
      doc-chars: 3000
      candidate-limit: 24
      auto-start:
        enabled: ${RERANKER_AUTO_START:true}
        required: ${RERANKER_REQUIRED:true}
        python-command: ${RERANKER_PYTHON:python}
        script: ${RERANKER_SCRIPT:src/main/resources/reranker/qwen3_reranker_server.py}
        model-path: ${RERANKER_MODEL_PATH:Qwen/Qwen3-Reranker-0.6B}
        device: ${RERANKER_DEVICE:auto}
        max-length: ${RERANKER_MAX_LENGTH:1024}
        batch-size: ${RERANKER_BATCH_SIZE:2}
        startup-timeout: ${RERANKER_STARTUP_TIMEOUT:10m}
        poll-interval: 1s
        instruction: "Given a financial filing question, rank passages by whether they contain the exact evidence, entities, periods, and figures needed to answer it."
  paper-rag:
    table: qasper_paper_chunks
    top-k: 8
    hybrid-top-k: 15
    judge-model-id: gpt
    quality-gate:
      enabled: true
      min-query-coverage: 0.35
      min-rerank-score: 0.05
    rerank:
      enabled: true
      url: http://127.0.0.1:8010
      model: Qwen3-Reranker-0.6B
      doc-chars: 3200
  mcp:
    http:
      headers:
        "[http://127.0.0.1:3501]":
          x-mcp-key: ${UTOOLS_MCP_KEY:}
        "[https://gwmcp.lkcoffee.com]":
          Authorization: "Bearer ${LUCKIN_MCP_TOKEN:}"
  tools:
    shell:
      command-timeout: 15m

server:
  address: 0.0.0.0
  port: 8080

logging:
  level:
    org.springframework.ai: DEBUG
    io.modelcontextprovider: DEBUG
    org.springframework.ai.chat.client.advisor: debug
    com.cc.springai: debug

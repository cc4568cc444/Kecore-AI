services:
  app:
    build:
      context: .
    image: springai:local
    ports:
      - "8088:8088"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/spring_agent
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: 123
      MIMO_KEY: ${MIMO_KEY:-}
      UTOOLS_MCP_KEY: ${UTOOLS_MCP_KEY:-}
      MY_COFFEE_MCP_AUTHORIZATION: ${MY_COFFEE_MCP_AUTHORIZATION:-}
      SPRING_AI_MCP_CLIENT_ENABLED: "false"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: spring_agent
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123
    ports:
      - "5432:5432"
    volumes:
      - springai-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d spring_agent"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  springai-postgres:
